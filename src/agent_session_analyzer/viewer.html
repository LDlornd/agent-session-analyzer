<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Harness Trace · 运行记录</title><link rel="stylesheet" href="/viewer.css"><script src="/viewer.js" defer></script></head>
<body>
<aside>
  <div class="brand"><span class="brand-icon">▤</span><div>Harness Trace<small>运行记录</small></div></div>
  <div class="side-heading"><span>实验与会话</span><button id="refresh" title="刷新文件与当前会话">刷新</button></div>
  <div class="navigation-mode" role="group" aria-label="运行类型">
    <button id="nav-experiments" type="button" aria-pressed="true">实验 <span id="experiment-count">0</span></button>
    <button id="nav-standalone" type="button" aria-pressed="false">独立运行 <span id="standalone-count">0</span></button>
  </div>
  <input id="search" type="search" placeholder="搜索任务、实验、模型或文件名…" aria-label="搜索会话">
  <div class="filters" aria-label="分类筛选">
    <label>Harness<select id="filter-harness"><option value="">全部 Harness</option></select></label>
    <label>模型<select id="filter-model"><option value="">全部模型</option></select></label>
    <label>条件<select id="filter-condition"><option value="">全部 condition</option></select></label>
  </div>
  <small id="file-count" aria-live="polite"></small>
  <nav id="files" aria-label="实验和运行记录"></nav>
  <details id="scan-controls" class="scan-controls">
    <summary><span>读取目录</span><small id="root-count">未选择</small></summary>
    <div class="scan-content">
      <button id="choose-root" type="button">选择扫描目录…</button>
      <small id="scan-help">通过系统窗口添加日志目录，自动识别实验及独立运行；可添加多个目录。</small>
      <ul id="selected-roots" aria-label="已选择的扫描目录"></ul>
    </div>
  </details>
</aside>
<main>
  <section id="experiment-section" class="experiment-panel" hidden aria-label="实验条件对比">
    <h2>实验条件对比</h2>
    <div class="comparison-controls">
      <label>实验<select id="compare-experiment"></select></label>
      <label>任务<select id="compare-task"><option value="">全部任务</option></select></label>
    </div>
    <p id="experiment-status" class="muted"></p>
    <div id="experiment-warnings" role="status"></div>
    <div id="condition-summary" class="comparison-scroll"></div>
    <p class="muted">同一实验按 task + repeat 配对；缺失值保留未知。耗时包含准备、执行、评分和清理。</p>
    <div id="trial-comparison" class="comparison-scroll trial-matrix"></div>
  </section>
  <header><div class="eyebrow">SESSION EXPLORER</div><div id="trace-context" class="trace-context" aria-label="当前运行归属" hidden></div><h1 id="title">选择一个会话</h1><p id="subtitle">从左侧打开已保存的 JSONL，查看执行层级和模型消耗。</p></header>
  <div id="message" role="status"></div>
  <section id="metrics" class="metrics" aria-label="统计"></section>
  <p id="coverage" class="muted"></p>
  <p id="trial-summary" class="trial-summary" hidden></p>
  <div class="section-heading"><h2>执行轨迹</h2><span class="muted">Session / Turn / Step / Attempt · Tool</span></div>
  <section id="timeline"><div class="empty">尚未选择文件</div></section>
  <details id="source-section" hidden><summary>全部事件 · 原始记录</summary><pre id="source"></pre></details>
</main>
</body></html>
