[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-analyzer"
version = "0.1.0"
description = "Record agent sessions as JSONL and explore turns, steps, model attempts and tools locally."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dsh = ["deepseek-harness-sdk>=0.1.5rc1"]
openhands = ["openhands-sdk>=1.49.1,<1.50"]

[project.scripts]
agent-session-analyzer = "agent_session_analyzer.viewer:main"

[project.urls]
Repository = "https://github.com/LDlornd/agent-session-analyzer"
Issues = "https://github.com/LDlornd/agent-session-analyzer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_session_analyzer = ["*.html", "*.css", "*.js"]
